name: renovate-checksums

# The hosted Renovate app bumps the *_COMMIT pins in install.sh but cannot
# recompute the matching *_SHA256 values. Do it here on Renovate's PRs.
on:
  pull_request:
    paths:
      - install.sh

permissions:
  contents: write

jobs:
  checksums:
    if: github.actor == 'renovate[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Recompute checksums
        run: |
          set -euo pipefail
          update() { # name repo path
            local commit sum
            commit="$(sed -nE "s/^$1_COMMIT=\"([a-f0-9]{40})\"/\1/p" install.sh)"
            sum="$(curl -fsSL "https://raw.githubusercontent.com/$2/${commit}/$3" | sha256sum | cut -d' ' -f1)"
            sed -i -E "s/^$1_SHA256=\".*\"/$1_SHA256=\"${sum}\"/" install.sh
          }
          update PATHOGEN tpope/vim-pathogen autoload/pathogen.vim
          update YARN_COMPLETION dsifford/yarn-completion yarn-completion.bash
      - name: Commit if changed
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "chore(install): update checksums"
            git push
          fi
